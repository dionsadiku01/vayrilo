.btn-ghost{background:transparent;border:1px solid #2A356A;color:var(--txt);height:50px;font-weight:700}
.icon-btn{width:44px;height:44px;border-radius:22px;border:none;display:flex;align-items:center;justify-content:center;color:var(--txt)}
.chip{font-size:12px;font-weight:800;padding:6px 10px;border-radius:12px;color:var(--bg);display:inline-block}

.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

function stack(ids, size, border){
  return '<span class="stack" style="padding-left:'+Math.round(size*0.36)+'px">' + ids.map(function(id){
    return '<img src="'+P[id]+'" alt="" style="width:'+size+'px;height:'+size+'px;border:2px solid '+border+';margin-left:-'+Math.round(size*0.36)+'px">';
  }).join('') + '</span>';
}

/* ---------- chats data ---------- */
function baseMsgs(id){
  if(id==='group') return [
    {from:'Lena',who:'lena',text:'Wer ist schon am Freitag da? Ich lande um 14 Uhr.'},
    {from:'Jonas',who:'jonas',text:'Ich auch! Erstes Bier am Pool?'},
    {from:'Hotel Casa Sol',who:'hotel',hotel:true,text:'Willkommen, Crew! Heute 21 Uhr Poolparty, das erste Getränk geht aufs Haus.'},
    {from:'Sara',who:'sara',text:GROUP_PREVIEW}
  ];
  var cp = crewById(id);
  if(cp) return [{from:cp.name,who:cp.id,text:cp.hi}];
  if(id.indexOf('ev-')===0){
    var ev = evById(id.slice(3));
    if(ev.mine) return [{from:'Vayrilo',who:'hotel',hotel:true,text:'Dein Plan ist online. Alle aus der Crew Casa Sol können ihn sehen und mitmachen.'}];
    return [
      {from:ev.hotel?'Hotel Casa Sol':'Jonas',who:ev.hotel?'hotel':'jonas',hotel:ev.hotel,text:'Schön, dass du dabei bist! '+ev.when+', '+ev.where+'.'},
      {from:'Lena',who:'lena',text:'Yes, endlich! Wer will vorher noch was essen?'}
    ];
  }
  return [];
}
function allMsgs(id){ return baseMsgs(id).concat(S.msgs[id]||[]); }
function chatMeta(id){

  if(id.indexOf('ev-')===0){ var ev=evById(id.slice(3)); return {title:ev.title,sub:ev.when+' · '+(ev.count+1)+' dabei',img:IMG[ev.img],radius:'14px',note:'Event-Chat · endet nach dem Event',isGroup:true,isDirect:false}; }
  var p=crewById(id); return {title:p.name+', '+p.age,sub:(p.hotel==='casasol'?'aus deiner Crew':'Match · '+hotelName(p.hotel)),img:P[p.id],radius:'22px',note:'Ihr habt beide Hallo gesagt',isGroup:false,isDirect:true};
}

function vDiscover(){
  var seg = [['people','Leute'],['hotels','Hotels']].map(function(s){

    return '<button type="button" data-a="disc" data-v="'+s[0]+'" aria-pressed="'+on+'" style="flex:1;height:40px;border:none;border-radius:20px;font-size:14px;font-weight:800;background:'+(on?'#F4F6FF':'transparent')+';color:'+(on?'#070C22':'#A7B0D6')+'">'+s[1]+'</button>';
  }).join('');

    '<div class="row" style="justify-content:space-between;align-items:flex-end;padding:0 20px"><div class="col" style="gap:4px"><div class="kicker" style="color:var(--mint)">MALLORCA · 12.–19. JULI</div><h1 class="h1" style="margin:0">Entdecken</h1></div>'+

function vPeople(){
  var scopes = [['hotel','Casa Sol',CREW.filter(function(p){return p.hotel==='casasol';}).length+19],['island','Ganz Mallorca',312]].map(function(s){
    var on = S.scope===s[0];
    return '<button type="button" data-a="scope" data-v="'+s[0]+'" aria-pressed="'+on+'" style="height:36px;padding:0 14px;border-radius:18px;border:1.5px solid '+(on?'#5EE6C0':'#2A356A')+';background:'+(on?'rgba(94,230,192,.14)':'transparent')+';color:'+(on?'#5EE6C0':'#D6DBF2')+';font-size:13px;font-weight:800">'+s[1]+' · '+s[2]+'</button>';
  }).join('');
  var lm = likedMeOpen();
  var teaser = !lm.length ? '' :
    '<button type="button" data-a="'+(S.pass?'scope':'passOpen')+'" data-v="island" class="row" style="margin:0 20px;gap:12px;text-align:left;border:1px solid rgba(244,199,123,.45);border-radius:22px;background:linear-gradient(135deg,#2E2A3A,#1A2350);padding:12px 14px">'+
      '<span class="stack" style="padding-left:12px">'+lm.map(function(p){ return '<img src="'+P[p.id]+'" alt="" style="width:36px;height:36px;border:2px solid #1A2350;margin-left:-12px;'+(S.pass?'':'filter:blur(5px)')+'">'; }).join('')+'</span>'+
      '<span class="col" style="flex:1;gap:2px"><span style="font-weight:800;font-size:14px">'+lm.length+' Leute haben dir Hallo gesagt</span><span style="font-size:12px;color:var(--sand);font-weight:700">'+(S.pass?'Sag zurück Hallo, dann ist es ein Match':'Mit dem Vayrilo Pass siehst du, wer')+'</span></span>'+ic.chev+'</button>';
  var d = deck();
  var card;
  if(!d.length){
    card = '<div class="col" style="margin:0 20px;height:440px;align-items:center;justify-content:center;gap:14px;text-align:center;border-radius:30px;border:1.5px dashed #2A356A;padding:24px">'+
      '<div class="u" style="font-weight:700;font-size:19px">Alle gesehen</div>'+
      '<div style="color:var(--muted);font-size:14px;line-height:1.5">'+(S.scope==='hotel'?'Das war deine Hotel-Crew. Auf ganz Mallorca sind diese Woche noch viel mehr Leute.':'Neue Leute kommen jeden Tag dazu. Schau bei den Events vorbei, dort lernst du am schnellsten Leute kennen.')+'</div>'+
      (S.scope==='hotel'?'<button type="button" class="btn btn-mint" data-a="scope" data-v="island" style="height:50px;width:auto;padding:0 22px">Ganz Mallorca zeigen</button>':'<button type="button" class="btn btn-mint" data-a="tab" data-v="events" style="height:50px;width:auto;padding:0 22px">Zu den Events</button>')+'</div>';
  } else {
    var p = d[0], nx = d[1], same = p.hotel==='casasol', com = common(p);
    var behind = nx ? '<div class="abs" style="inset:0;transform:scale(.94) translateY(16px);border-radius:30px;overflow:hidden;opacity:.55"><img class="fill" src="'+P[nx.id]+'" alt=""></div>' : '';
    card = '<div style="position:relative;margin:0 20px;height:440px">'+behind+
      '<div id="swipe" data-id="'+p.id+'" class="abs" style="inset:0;border-radius:30px;overflow:hidden;background:var(--card);touch-action:pan-y;box-shadow:0 18px 40px rgba(0,0,0,.45);cursor:grab">'+
        '<img class="fill" src="'+P[p.id]+'" alt="'+p.name+', '+p.age+'" draggable="false">'+
        '<div class="abs" style="inset:0;background:linear-gradient(180deg,rgba(7,12,34,.35) 0%,rgba(7,12,34,0) 25%,rgba(7,12,34,0) 50%,rgba(7,12,34,.95) 100%)"></div>'+
        '<span class="abs u stamp-like" style="top:26px;left:20px;padding:6px 12px;border:3px solid var(--mint);color:var(--mint);border-radius:12px;font-weight:800;font-size:20px;transform:rotate(-12deg);opacity:0">HALLO</span>'+
        '<span class="abs u stamp-pass" style="top:26px;right:20px;padding:6px 12px;border:3px solid var(--coral);color:var(--coral);border-radius:12px;font-weight:800;font-size:20px;transform:rotate(12deg);opacity:0">WEITER</span>'+
        '<div class="abs row" style="top:14px;left:14px;right:14px;gap:6px;flex-wrap:wrap">'+
          '<span class="chip" style="font-size:11px;background:'+(same?'var(--mint)':'#F4F6FF')+'">'+(same?'DEIN HOTEL':esc(hotelName(p.hotel)).toUpperCase())+'</span>'+
          '<span class="chip glass" style="font-size:11px;color:var(--txt);background:rgba(7,12,34,.55)">Selfie ✓</span>'+
          (showDating(p)?'<span class="chip" style="font-size:11px;background:#FF9CC2;display:inline-flex;gap:4px;align-items:center">'+ic.heart+'Auch offen für Dates</span>':'')+'</div>'+
        '<div class="abs col" style="left:18px;right:18px;bottom:16px;gap:8px">'+
          '<div class="row" style="justify-content:space-between;align-items:flex-end"><div class="col" style="gap:3px"><span class="u" style="font-weight:800;font-size:26px">'+p.name+', '+p.age+'</span>'+
          '<span style="color:var(--soft);font-size:14px">'+p.city+' · da vom '+p.dates+'</span></div>'+
          '<button type="button" class="icon-btn glass" data-a="person" data-v="'+p.id+'" aria-label="Ganzes Profil von '+p.name+'">'+ic.info+'</button></div>'+
          (com.length?'<div style="font-size:13px;font-weight:700;color:var(--mint)">Gemeinsam: '+com.join(', ')+'</div>':'')+
          '<div class="row" style="gap:6px;flex-wrap:wrap">'+p.interests.map(function(t){return '<span class="glass" style="font-size:12px;font-weight:700;padding:5px 10px;border-radius:10px;background:rgba(255,255,255,.14)">'+t+'</span>';}).join('')+'</div>'+
        '</div></div></div>'+
      '<div class="row" style="justify-content:center;gap:22px">'+
        '<button type="button" data-a="swPass" aria-label="Weiter" style="width:64px;height:64px;border-radius:32px;border:2px solid #2A356A;background:var(--card);color:var(--coral);display:flex;align-items:center;justify-content:center">'+ic.x+'</button>'+
        '<button type="button" data-a="swLike" aria-label="Hallo sagen" style="height:64px;padding:0 28px;border-radius:32px;border:none;background:var(--mint);color:var(--bg);font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px">'+ic.wave+'Hallo sagen</button></div>';
  }
  var foot = S.pass ? '<span style="color:var(--sand);font-weight:800">Pass aktiv</span> · unbegrenzt Hallo sagen' : 'Noch <b style="color:var(--txt)">'+S.likes+'</b> Hallos heute · <button type="button" data-a="passOpen" style="border:none;background:transparent;color:var(--sand);font-weight:800;padding:0;font-size:13px">Unbegrenzt mit Pass</button>';

    '<div style="text-align:center;font-size:13px;color:var(--muted);padding:0 20px">'+foot+'</div>'+
    '<div class="row" style="gap:10px;align-items:flex-start;font-size:12px;color:var(--muted);line-height:1.45;padding:0 24px"><span style="color:var(--mint);flex-shrink:0">'+ic.shield+'</span>Schreiben könnt ihr erst, wenn ihr beide Hallo gesagt habt. Wer dich nicht interessiert, erfährt nichts davon.</div>';

function vHotelList(){
  var regions = REGIONS.map(function(r){
    return '<button type="button" data-a="region" data-v="'+r[0]+'" aria-pressed="'+(S.region===r[0])+'" style="flex-shrink:0;width:112px;height:132px;padding:0;border-radius:20px;border:3px solid '+(S.region===r[0]?'var(--mint)':'transparent')+';position:relative;overflow:hidden;background:var(--card)">'+
      '<img class="fill" src="'+IMG[r[2]]+'" alt="" style="'+(r[4]?'filter:grayscale(.7) brightness(.7)':'')+'"><span class="shade-b"></span>'+
      '<span class="abs col" style="left:10px;right:10px;bottom:10px;text-align:left;gap:2px"><span style="font-weight:800;font-size:14px">'+r[1]+'</span><span style="color:'+(r[4]?'var(--sand)':'var(--mint)')+';font-weight:700;font-size:11px">'+r[3]+'</span></span></button>';
  }).join('');
  if(!HOTELS[S.region].length){
    var rn = REGIONS.filter(function(r){return r[0]===S.region;})[0][1];
    return '<div class="hscroll" style="gap:10px;padding:0 20px">'+regions+'</div>'+
      '<div class="col card" style="margin:0 20px;gap:12px;padding:22px;text-align:center;align-items:center"><div class="u" style="font-weight:700;font-size:18px">'+rn+' kommt bald</div><div style="color:var(--muted);font-size:14px;line-height:1.5">Wir starten erst, wenn genug Leute da sind. Trag dich ein, dann melden wir uns.</div><button type="button" class="btn btn-mint" data-a="notify" data-v="'+rn+'" style="height:48px;width:auto;padding:0 22px">Benachrichtige mich</button></div>';
  }
  var hotels = HOTELS[S.region].map(function(h){
    return '<button type="button" data-a="hotel" data-v="'+h.id+'" style="position:relative;height:260px;border:none;padding:0;border-radius:26px;overflow:hidden;text-align:left;background:var(--card);width:100%">'+
      '<img class="fill" src="'+IMG[h.img]+'" alt="'+esc(h.name)+'">'+
      '<span class="abs" style="inset:0;background:linear-gradient(180deg,rgba(7,12,34,.1) 30%,rgba(7,12,34,.92) 100%)"></span>'+
      '<span class="chip abs" style="top:14px;left:14px;background:'+h.badgeBg+';font-size:11px">'+h.badge+'</span>'+
      '<span class="abs row glass" style="top:14px;right:14px;gap:6px;padding:5px 10px 5px 5px;border-radius:16px">'+stack(['lena','jonas','mia'],22,'#070C22')+'<span style="font-size:12px;font-weight:800">'+h.guests+' Gäste</span></span>'+
      '<span class="abs col" style="left:18px;right:18px;bottom:16px;gap:8px">'+
        '<span class="u" style="font-weight:800;font-size:21px">'+esc(h.name)+'</span>'+
        '<span class="row" style="gap:6px;font-size:13px;color:var(--soft)">'+ic.pin+esc(h.place)+' · '+h.ages+' Jahre</span>'+
        '<span class="row" style="gap:6px;flex-wrap:wrap">'+h.tags.map(function(t){return '<span class="glass" style="font-size:12px;font-weight:700;padding:5px 10px;border-radius:10px;background:rgba(255,255,255,.14)">'+t+'</span>';}).join('')+'</span>'+
      '</span></button>';
  }).join('');
  return '<label class="row" style="margin:0 20px;gap:10px;height:50px;border-radius:25px;background:var(--card);border:1px solid var(--line);padding:0 18px;color:var(--muted)">'+ic.search+'<span class="sr">Suche</span><input placeholder="Hotel oder Ort suchen" style="flex:1;border:none;background:transparent;color:var(--txt);font-size:15px;outline:none"></label>'+
    '<div class="hscroll" style="gap:10px;padding:0 20px">'+regions+'</div>'+
    '<div class="row" style="justify-content:space-between;align-items:baseline;padding:0 20px"><div class="h2">Partnerhotels</div><div style="font-size:12px;color:var(--muted)">nur Zahlen, keine Namen</div></div>'+
    '<div class="col" style="gap:16px;padding:0 20px">'+hotels+'</div>';
}

var root = document.getElementById('phone');
function render(){
  var keep = {};
  root.querySelectorAll('[data-scroll]').forEach(function(el){ keep[el.getAttribute('data-scroll')] = el.scrollTop; });
  var focusId = document.activeElement && document.activeElement.id;
  var html = '';
  if(S.stage==='splash') html = vSplash();
  else if(S.stage==='verify') html = vVerify();
  else if(S.stage==='selfie') html = vSelfie();
  else {
    var body = {discover:vDiscover,trip:vTrip,events:vEvents,chats:vChats,profile:vProfile}[S.tab]();
    html = '<div class="abs scroll" data-scroll="main-'+S.tab+'" style="inset:0;padding-bottom:calc(env(safe-area-inset-bottom) + 110px)">'+body+'</div>'+vNav()+
      (S.hotel?vHotel():'')+(S.chat?vChat():'')+(S.person?vPerson():'')+(S.passSheet?vPass():'')+(S.planSheet?vPlan():'')+(S.match?vMatch():'');
  }
  root.innerHTML = html + vToast();
  root.querySelectorAll('[data-scroll]').forEach(function(el){ var k=el.getAttribute('data-scroll'); if(keep[k]) el.scrollTop = keep[k]; });
  var box = document.getElementById('msgs'); if(box) box.scrollTop = box.scrollHeight;
  if(focusId){ var f = document.getElementById(focusId); if(f){ f.focus(); if(f.setSelectionRange){ var l=f.value.length; f.setSelectionRange(l,l); } } }
  if(!S.passSheet) delete shownSheets['Vayrilo Pass'];
  if(!S.planSheet) delete shownSheets['Plan erstellen'];
  bindSwipe();
}

/* ---------- swipe ---------- */
function bindSwipe(){
  var c = document.getElementById('swipe'); if(!c) return;
  var x0=null, dx=0, like=c.querySelector('.stamp-like'), pass=c.querySelector('.stamp-pass');
  function move(d){ c.style.transform='translateX('+d+'px) rotate('+(d/18)+'deg)'; like.style.opacity=Math.max(0,Math.min(1,d/90)); pass.style.opacity=Math.max(0,Math.min(1,-d/90)); }
  c.addEventListener('pointerdown',function(e){ if(e.target.closest('button')) return; x0=e.clientX; dx=0; c.style.transition='none'; c.style.cursor='grabbing'; try{c.setPointerCapture(e.pointerId);}catch(_){} });
  c.addEventListener('pointermove',function(e){ if(x0===null) return; dx=e.clientX-x0; move(dx); });
  function end(){ if(x0===null) return; x0=null; c.style.cursor='grab';
    if(dx>90) fly(1); else if(dx<-90) fly(-1); else { c.style.transition='transform .25s ease'; move(0); } }
  c.addEventListener('pointerup',end); c.addEventListener('pointercancel',end);
}
function fly(dir){
  var c = document.getElementById('swipe'); if(!c) return;
  var id = c.getAttribute('data-id');
  if(dir>0 && !S.pass && S.likes<=0){ c.style.transition='transform .25s ease'; c.style.transform='none'; set({passSheet:true}); return; }
  c.style.transition='transform .3s ease-in'; c.style.transform='translateX('+(dir*520)+'px) rotate('+(dir*24)+'deg)';
  var st = c.querySelector(dir>0?'.stamp-like':'.stamp-pass'); if(st) st.style.opacity=1;
  setTimeout(function(){ if(dir>0) like(id); else { S.swiped[id]='pass'; render(); } },260);
}
function like(id){
  var p = crewById(id);
  if(!S.pass && S.likes<=0){ set({passSheet:true}); return; }
  S.swiped[id]='like'; S.requested[id]=true; if(!S.pass) S.likes--;
  if(p.likedMe){ S.matched[id]=true; if(id==='tim') S.tim='accepted'; S.person=null; set({match:id}); }
  else { S.person=null; flash('Hallo an '+p.name+' gesendet. Sagt '+p.name+' auch Hallo, ist es ein Match.'); }
}
function set(p){ for(var k in p) S[k]=p[k]; render(); }
var toastT;
function flash(t){ S.toast=t; render(); clearTimeout(toastT); toastT=setTimeout(function(){ S.toast=''; render(); },2600); }

/* ---------- actions ---------- */
var A = {
  adult:function(){ set({adult:!S.adult}); },
  start:function(){ if(!S.adult){ flash('Bitte bestätige zuerst, dass du mindestens 18 bist.'); return; } set({stage:'verify'}); },
  skip:function(){ set({stage:'app',tab:'trip',inApp:true,selfie:true}); },
  backVerify:function(){ set({stage:S.inApp?'app':'splash',hotel:null}); },
  selfieBack:function(){ set({stage:S.inApp?'app':'verify'}); },
  confirm:function(){ S.hotel=null; S.stage='selfie'; flash('Aufenthalt bestätigt. Noch ein kurzer Schritt.'); },
  selfie:function(){ set({checking:true}); setTimeout(function(){ S.checking=false; S.selfie=true; S.inApp=true; S.stage='app'; S.tab='trip'; flash('Verifiziert! Willkommen in der Crew.'); },1400); },
  selfieLater:function(){ S.inApp=true; S.stage='app'; S.tab='trip'; flash('Willkommen in der Crew! Den Selfie-Check findest du im Profil.'); },
  toSelfie:function(){ set({stage:'selfie'}); },
  disc:function(v){ set({disc:v}); },
  scope:function(v){ set({scope:v,disc:'people',passSheet:false}); },
  island:function(){ A.tab('discover'); set({disc:'people',scope:'island'}); },
  swLike:function(){ fly(1); },
  swPass:function(){ fly(-1); },
  passOpen:function(){ set({passSheet:true,person:null}); },
  passClose:function(){ set({passSheet:false}); },
  buyPass:function(){ S.pass=true; S.passSheet=false; flash('Pass aktiv (Test-App, kein echter Kauf). Jetzt siehst du, wer dir Hallo gesagt hat.'); },
  dating:function(){ var was=S.dating; S.dating=!was; flash(was?'Offen für Dates ist aus.':'An. Nur wer das auch eingeschaltet hat, sieht es bei dir.'); },
  notify:function(v){ flash('Gemerkt! Wir melden uns, sobald '+v+' startet.'); },
  closeMatch:function(){ set({match:null}); },
  planSet:function(v){ var kv=v.split('|'); S.plan[kv[0]]=kv[1]; render(); },
  planClose:function(){ set({planSheet:false}); },
  planSave:function(){
    var pl=S.plan, t=(pl.title||'').trim();
    if(!t){ flash('Gib deinem Plan noch einen Namen, z. B. „Sunset am Pool“.'); var i=document.getElementById('plantitle'); if(i) i.focus(); return; }
    var img={'Pool':'poolbar','Rooftop-Bar':'rooftop','Lobby':'casasol','Strand vorm Hotel':'splash'}[pl.place];
    var id='p'+(++S.planN);
    EVENTS.unshift({id:id,title:t,day:pl.day.toUpperCase(),time:pl.time,when:pl.day+' · '+pl.time,where:pl.place+', Casa Sol',host:'VON DIR',hotel:false,mine:true,count:0,img:img,av:['alex']});
    S.joined[id]=true; S.planSheet=false; S.evFilter='all'; S.plan={title:'',day:'Heute',time:'19:00',place:'Pool'};
    flash('Dein Plan ist online. Die Crew sieht ihn jetzt.');
  },
  scan:function(){ flash('Die Kamera öffnet sich zum Scannen (in der Test-App nicht aktiv).'); },
  tab:function(v){ set({tab:v,hotel:null,chat:null,person:null,menu:false,match:null,passSheet:false,planSheet:false,seenChats:S.seenChats||v==='chats'}); var m=root.querySelector('[data-scroll^="main"]'); if(m) m.scrollTop=0; },
  region:function(v){ set({region:v}); },
  hotel:function(v){ set({hotel:v}); },
  closeHotel:function(){ set({hotel:null}); },
  book:function(){ flash('Hier geht es zur Buchungsseite des Hotels (Test-App).'); },
  toVerify:function(){ set({stage:'verify',hotel:null}); },
  more:function(){ flash('Hier erscheint die ganze Crew (die Test-App zeigt 6).'); },
  chat:function(v){ set({chat:v,person:null,match:null,menu:false,draft:''}); },
  closeChat:function(){ set({chat:null,menu:false}); },
  menu:function(){ set({menu:!S.menu}); },
  report:function(){ S.menu=false; flash('Danke für die Meldung. Unser Team prüft das.'); },
  block:function(){ S.blocked[S.chat]=true; S.chat=null; S.menu=false; flash('Blockiert. Ihr seht euch gegenseitig nicht mehr.'); },
  mute:function(){ S.menu=false; flash('Chat stummgeschaltet.'); },
  leave:function(){ S.menu=false; S.chat=null; flash('In der Test-App bleibst du in der Gruppe.'); },
  person:function(v){ set({person:v}); },
  closePerson:function(){ set({person:null}); },
  hello:function(v){ like(v); },
  reportP:function(){ S.person=null; flash('Danke für die Meldung. Unser Team prüft das.'); },
  blockP:function(){ S.blocked[S.person]=true; S.person=null; flash('Blockiert. Ihr seht euch gegenseitig nicht mehr.'); },
  join:function(v){ var j=!!S.joined[v]; S.joined[v]=!j; flash(j?'Du bist nicht mehr dabei.':'Du bist dabei! Der Event-Chat ist offen.'); },
  evf:function(v){ set({evFilter:v}); },
  create:function(){ set({planSheet:true}); },
  accTim:function(){ S.tim='accepted'; S.matched.tim=true; flash('Du kannst jetzt mit Tim schreiben.'); },
  decTim:function(){ S.tim='declined'; S.swiped.tim='pass'; flash('Abgelehnt. Tim erfährt davon nichts.'); },
  open:function(v){ S.open[v]=!S.open[v]; render(); },
  invis:function(){ var was=S.invisible; S.invisible=!was; flash(was?'Du bist wieder sichtbar.':'Unsichtbar: Die Crew sieht dich nicht.'); },
  edit:function(){ flash('Profil bearbeiten kommt in der echten App.'); },
  settings:function(){ flash('Einstellungen kommen in der echten App.'); },
  plus:function(){ set({passSheet:true}); }
};
root.addEventListener('click',function(e){
  var el = e.target.closest('[data-a]'); if(!el || !root.contains(el)) return;
  var fn = A[el.getAttribute('data-a')]; if(!fn) return;
  if(el.tagName!=='INPUT') e.preventDefault();
  fn(el.getAttribute('data-v'));
});
root.addEventListener('input',function(e){
  var k = e.target.getAttribute && e.target.getAttribute('data-input'); if(k==='planTitle') S.plan.title=e.target.value; else if(k) S[k]=e.target.value;
});
root.addEventListener('submit',function(e){
  if(e.target.getAttribute('data-form')!=='send') return;
  e.preventDefault();
  var t=(S.draft||'').trim(); if(!t||!S.chat) return;
  (S.msgs[S.chat]=S.msgs[S.chat]||[]).push({from:'Du',text:t,mine:true});
  S.draft=''; render(); var i=document.getElementById('msg'); if(i) i.focus();
});
render();
})();
</script>
</body>
</html>
